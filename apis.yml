apis:
- aid: payto:payto-npp-developer-resources
  name: PayTo / NPP Developer Resources
  description: >-
    PayTo's public developer surface, published by Australian Payments Plus (AP+) and
    NPP Australia. Rather than a self-serve API hosted by the scheme, this covers the
    AP+ Developer Portal (login-gated APIs and documentation sections), the NPP API
    Framework v5.0 that defines the ISO 20022-aligned data attributes and technical
    approach for PayTo agreements and payment initiation, and the NPP API sandbox for
    building and testing NPP-based solutions. The production PayTo APIs are implemented
    by NPP Participants and connected payment service providers, not by the scheme itself.
