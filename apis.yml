name: PayTo
kind: company
description: >-
  PayTo is Australia's real-time mandated-payments service, operated by Australian
  Payments Plus (AP+) as an overlay on the New Payments Platform (NPP). It lets
  merchants, billers, and payment service providers establish digital, pre-authorised
  agreements (mandates) that debit a customer's bank account in real time using either
  a PayID or BSB and account number, with the mandate authorised, viewed, and managed
  by the account holder inside their own banking app. PayTo is positioned as the modern
  successor to the legacy BECS direct-debit rails, adding instant settlement, richer
  ISO 20022 data, and central mandate management via the NPP Mandate Management Service.
  As a domestic rail and scheme operator, AP+/NPP Australia is documentation- and
  rulebook-first: it publishes the NPP API Framework (v5.0, aligned to ISO 20022) that
  defines the mandatory data attributes and technical approach for PayTo and NPP APIs,
  but it does not itself host or offer a self-serve public API. The actual PayTo APIs
  are implemented and exposed by NPP Participants (banks) and connected payment service
  providers, so the company's public developer surface is a portal, framework, sandbox,
  and message specifications rather than a downloadable OpenAPI.
